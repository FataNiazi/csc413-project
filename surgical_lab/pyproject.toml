[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "surgical-lab"
version = "0.0.1"
license = "Apache-2.0"
description = "Train a surgical robot to accomplish manipulation tasks"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    {name = "Mustafa Haiderbhai"},
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab",
    # torch/torchvision arrive transitively via mjlab, but tool.uv.sources only
    # binds packages declared here -- so they must be direct deps for the
    # pytorch-cu128 pin below to take effect at all.
    "torch",
    "torchvision",
    "warp-lang>=1.12.0",
    # same reason: must be direct so the vendored third_party/mujoco_warp source binds
    "mujoco-warp",
    "ruff>=0.14.0",
    "rsl-rl-lib",
    # We encode rollout videos to mp4 ourselves and hand wandb.Video a file path.
    # Passing raw arrays instead would pull in moviepy, whose pillow/decorator pins
    # conflict with the rest of the tree. imageio-ffmpeg ships the ffmpeg binary, so
    # compute nodes need no system codec.
    "imageio-ffmpeg>=0.4.9",
    "vit-pytorch==1.10.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab"}
# vendored v3.10.0.1 + the mesh-bounding-box renderer fix, see third_party/README.md
mujoco-warp = { path = "third_party/mujoco_warp" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
# PyPI's torch 2.11 is a cu130 build, which needs driver >= 580. The lab PC's
# RTX 3090 is on 570.133.07 (CUDA 12.8), so cu130 fails with "driver is too
# old". Same version from the cu128 index instead -- cu128 covers sm_86 (3090),
# sm_89 (Ada) and sm_90 (H100), so this works on Fir too.
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "ty>=0.0.1a26",
]

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 2
exclude = [
  "typings",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[project.entry-points."mjlab.tasks"]
  surgical_lab = "surgical_lab.tasks"

[tool.pyright]
pythonVersion = "3.10"
ignore = ["./typings", "./scripts"]
stubPath = "typings"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src"]
exclude = ["typings"]
